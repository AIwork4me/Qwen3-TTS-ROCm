# Qwen3-TTS-ROCm weekly upstream drift watcher (Task 15).
#
# Runs scripts/check_upstream_drift.py against the committed
# docs/upstream-baseline.json on a CPU-only GitHub-hosted runner:
# upstream main SHA, qwen-tts PyPI version, upstream repo tree hashes and
# the installed package's generate-API signatures. The job FAILS on drift
# (script exit 1) so a human decides about revalidation — the script never
# auto-marks new upstream capability as Radeon-compatible. Exit 2
# (network/API flake or rate limit) fails the job too; consult the step
# log to tell a network failure from real drift before acting.
#
# CPU torch is installed FIRST from the PyTorch CPU index (same trick as
# ci.yml) because the drift script imports qwen_tts for its API-surface
# leg, and that resolves torchaudio -> torch without pulling the
# multi-gigabyte CUDA-bundled stack from PyPI.
#
# Supply chain: like ci.yml, third-party actions are pinned to full commit
# SHAs; least privileges (contents: read).

name: upstream-drift

on:
  schedule:
    - cron: "17 3 * * 1" # weekly Mondays 03:17 UTC (off the top of the hour; GitHub schedules in UTC and may delay)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CPU-only PyTorch (avoids CUDA wheels from PyPI)
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install qwen-tts (pinned version for the API-surface leg)
        run: python -m pip install "qwen-tts==0.1.1"

      - name: Upstream drift check vs committed baseline
        run: python scripts/check_upstream_drift.py
