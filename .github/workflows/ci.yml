# Qwen3-TTS-ROCm CPU-only CI (lint + hermetic unit tests + packaging).
#
# CPU torch is installed FIRST from the PyTorch CPU index, so the dependency
# resolution of `pip install -e ".[dev]"` (qwen-tts -> torchaudio -> torch)
# reuses it instead of pulling the multi-gigabyte CUDA-bundled stack from
# PyPI. Verified equivalent in a fresh venv: the CPU selection reports the
# same "202 passed, 1 skipped, 25 deselected" (the skip is the HIP-gated
# sdpa-default check, which needs an AMD torch build to run).
# This job never synthesizes audio or touches a GPU; ROCm wheels are
# installed by scripts/install.sh on gfx1151 hardware only.

name: ci

on:
  push:
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check .

      - name: Install CPU-only PyTorch (avoids CUDA wheels from PyPI)
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      # Resolves against the CPU wheels above — matching versions, no CUDA stack.
      - name: Install package (+dev extras)
        run: pip install -e ".[dev]"

      - name: Unit tests (no GPU, no model downloads)
        run: pytest -m "not gpu and not requires_download" -q

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
