# pyproject.toml
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-tts-rocm"
version = "0.2.0"
description = "ROCm (gfx1151) runtime adapter, model manager and enhanced Gradio demo for Qwen3-TTS"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Qwen3-TTS-ROCm contributors" }]
keywords = [
  "qwen3-tts", "tts", "text-to-speech", "speech-synthesis",
  "rocm", "amd", "radeon", "gfx1151", "ryzen-ai", "strix-halo",
  "voice-cloning", "voice-design", "pytorch", "gradio",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "qwen-tts==0.1.1",
  "modelscope",
  "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/AIwork4me/Qwen3-TTS-ROCm"
Repository = "https://github.com/AIwork4me/Qwen3-TTS-ROCm"
Issues = "https://github.com/AIwork4me/Qwen3-TTS-ROCm/issues"
Changelog = "https://github.com/AIwork4me/Qwen3-TTS-ROCm/blob/main/CHANGELOG.md"
Documentation = "https://github.com/AIwork4me/Qwen3-TTS-ROCm/blob/main/README.md"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
demo = ["gradio>=6,<7", "soundfile"]
# Quality-benchmark toolchain (Task 14 / brief 15). Versions pinned to the
# stack validated by the Step 14.1 investigation gates
# (evidence/quality-benchmark-2026-09-21.txt): jiwer Apache-2.0, resemblyzer
# Apache-2.0, openai-whisper MIT, pystoi MIT. `pesq` is deliberately absent:
# REJECTED at the license gate (bundled ITU-T P.862 reference code carries a
# restrictive Psytechnics/OPTICOM IPR notice — see the evidence transcript).
quality = [
  "jiwer==4.0.0",
  "resemblyzer==0.1.4",
  "openai-whisper==20250625",
  "pystoi==0.4.1",
]

[project.scripts]
qwen3-tts-rocm-check = "qwen3_tts_rocm.cli_check:main"
qwen3-tts-rocm-demo = "qwen3_tts_rocm.cli_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen3_tts_rocm = ["py.typed", "demo/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a working ROCm GPU (deselect with -m 'not gpu')",
  "requires_download: requires downloaded model weights",
]

[tool.ruff]
line-length = 110
target-version = "py310"
